name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Ruff linter
        run: uv run ruff check . || echo "⚠️  Ruff lint warnings — fix before merge"

      - name: Ruff formatter check
        run: uv run ruff format --check . || echo "⚠️  Ruff format warnings — fix before merge"

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --group dev

      - name: Compile-check
        run: |
          uv run python -m py_compile \
            server.py config.py \
            tools/search.py tools/fetch.py \
            tools/fetch_with_links.py tools/deep_research.py \
            tools/_content_cache.py tools/_pagination.py tools/_embeddings.py

      - name: Unit tests
        run: uv run pytest tests/ -v
