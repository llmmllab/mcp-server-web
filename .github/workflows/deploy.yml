name: Deploy MCP Server (web)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Build & Deploy mcp-server-web
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Build & Deploy
        run: |
          set -euo pipefail
          REGISTRY=192.168.0.71:31500
          IMAGE=mcp-server-web
          NAMESPACE=llmmllab
          SHA=${{ github.sha }}
          SHORT_SHA=$(echo $SHA | cut -c1-7)

          echo "Building ${IMAGE} (SHA: $SHORT_SHA)..."

          # k8s/deployment.yaml pins ``kubernetes.io/arch: arm64`` so
          # the cluster only ever pulls arm64.  Build that arch via
          # the ``multibuilder`` buildx builder (the api repo uses the
          # same one — pre-configured on lsnode-3 with QEMU emulation
          # and the insecure-registry flag) and ``--load`` the result
          # into the local docker daemon.  Then plain ``docker push``
          # — buildx's direct push defaults to HTTPS and fails against
          # our HTTP cluster registry, but the daemon honours the
          # ``insecure-registries`` config in /etc/docker/daemon.json.
          docker buildx build --builder multibuilder \
            --platform linux/arm64 \
            -t ${REGISTRY}/${IMAGE}:${SHA} \
            --load .

          docker push ${REGISTRY}/${IMAGE}:${SHA}
          docker tag ${REGISTRY}/${IMAGE}:${SHA} ${REGISTRY}/${IMAGE}:latest
          docker push ${REGISTRY}/${IMAGE}:latest

          # Apply manifests and roll the deployment so the new :latest is
          # actually pulled by the kubelet on the next pod start.
          echo "Deploying to Kubernetes (namespace ${NAMESPACE})..."
          kubectl create namespace "${NAMESPACE}" --dry-run=client -o yaml | kubectl apply -f -
          kubectl apply -f k8s/deployment.yaml
          kubectl rollout restart deployment/${IMAGE} -n "${NAMESPACE}"
          kubectl rollout status  deployment/${IMAGE} -n "${NAMESPACE}" --timeout=300s

          echo ""
          echo "Deployed ${IMAGE}:${SHORT_SHA}"
          echo "  Service: ${IMAGE}.${NAMESPACE}.svc.cluster.local:8000"
