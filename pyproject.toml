[project]
name = "mcp-server-web"
version = "0.1.0"
description = "MCP server for web search (SearxNG) and web content fetching (BeautifulSoup + Playwright)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=3.2.4",
    "aiohttp>=3.9.0",
    "beautifulsoup4>=4.12.0",
    "playwright>=1.40.0",
    "httpx>=0.28.1",
]
